name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: |
          cd app-mobile
          npm ci

      - name: Gerar projeto nativo Android (Expo prebuild)
        run: |
          cd app-mobile
          npx expo prebuild --platform android --clean

      - name: Configurar assinatura de release e remover símbolos de debug
        run: |
          cd app-mobile
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/akiofertas-release.keystore
          python3 - <<'EOF'
          import re

          path = "android/app/build.gradle"
          s = open(path).read()

          s = re.sub(
              r"(debug\s*\{\s*storeFile file\('debug\.keystore'\)\s*storePassword 'android'\s*keyAlias 'androiddebugkey'\s*keyPassword 'android'\s*\})",
              r"""\1
        release {
            storeFile file('akiofertas-release.keystore')
            storePassword System.getenv('AKI_RELEASE_STORE_PASSWORD')
            keyAlias 'akiofertas'
            keyPassword System.getenv('AKI_RELEASE_STORE_PASSWORD')
        }""",
              s,
              count=1,
          )

          s = re.sub(
              r"(// Caution! In production.*?signingConfig signingConfigs)\.debug",
              r"\1.release\n            ndk { debugSymbolLevel \"none\" }",
              s,
              count=1,
              flags=re.S,
          )

          assert "akiofertas-release.keystore" in s, "signing block not inserted"
          assert "signingConfig signingConfigs.release" in s, "release build type not repointed"

          open(path, "w").write(s)
          EOF

      - name: Build do .aab
        env:
          AKI_RELEASE_STORE_PASSWORD: ${{ secrets.AKI_RELEASE_STORE_PASSWORD }}
        run: |
          cd app-mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Enviar .aab como artefato
        uses: actions/upload-artifact@v4
        with:
          name: aki-ofertas-release-aab
          path: app-mobile/android/app/build/outputs/bundle/release/*.aab
