workflows:
  aki-ofertas-mobile:
    name: Aki Ofertas — Build de produção (iOS)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: akiofertas_appstore
    environment:
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.akiofertas.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Instalar dependências
        script: |
          cd app-mobile
          npm ci
      - name: Gerar projeto nativo iOS (Expo prebuild)
        script: |
          cd app-mobile
          npx expo prebuild --platform ios --clean
      - name: Configurar assinatura de código no projeto Xcode
        script: |
          cd app-mobile
          xcode-project use-profiles
      - name: Numerar o build (obrigatório ser maior que o anterior na Apple)
        script: |
          cd app-mobile/ios
          agvtool new-version -all $(date +%s)
      - name: Build do .ipa
        script: |
          cd app-mobile
          XCWORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$XCWORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$XCWORKSPACE" --scheme "$SCHEME"
    artifacts:
      - app-mobile/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - rafaelconsorciospalhoca@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
